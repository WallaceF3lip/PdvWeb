<div class="container text-center">
    <div class="row mh-100">
      <div class="col-7">
        
        <app-pdv-card-product
          [products]="products"
          (productSelected)="addToCart($event)"/>

      </div>
      <div class="col-5" style="height: 30rem;">
        <div class="row">
          <div class="container">
            <div class="p-2 mb-2 bg-dark-subtle text-dark-emphasis shadow rounded">
              <h1>Carrinho</h1><br>
              <div class="overflow-y-auto">
                
                <app-table
                [displayedColumns]="displayedColumnsProduct"
                [fields]="fieldsProduct"
                [dataSource]="cartProducts()"
                (selectItem)="selectItem($event)"
                data-bs-toggle="modal" data-bs-target="#updateProduct">
                </app-table>

              </div>
              <h5 class="text-start">Total: R$ {{totalAmount()}}</h5><br>
              <button type="button" class="btn btn-success m-3" (click)="salePending = false" data-bs-toggle="modal" data-bs-target="#sale">Finalizar Venda</button>
              <!-- <button type="button" class="btn btn-warning m-3" (click)="salePending = true" data-bs-toggle="modal" data-bs-target="#sale">Pendente</button> -->
              <button type="button" class="btn btn-danger m-3" (click)="cancelSale()">Cancelar Venda</button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
  
  <app-modal idModel="sale" title="Finalização da Venda">

    <div inputs>

      <div class="input-group mb-3">
        <span class="input-group-text" id="inputGroup-sizing-default">Nome do Cliente</span>
        <input type="text" class="form-control" aria-label="Sizing example input" aria-describedby="inputGroup-sizing-default" [(ngModel)]="sale.client" name="name" required>
      </div>
      
      <div class="card border-dark mb-2" >
        <div class="input-group mb-3 mt-3">
          <span class="input-group-text">Valor Total</span>
          <input type="text" (keypress)="NumberKey($event )" class="form-control" aria-label="Dollar amount (with dot and two decimal places)" [ngModel]="totalAmount()" name="price" disabled>
        </div>
        
        <div class="input-group mb-3">
          <div class="input-group-prepend">
            <div class="input-group-text">
              <label><input type="checkbox" [(ngModel)]="ckbCredito"></label>
            </div>
          </div>
          <input type="text" class="form-control" (keypress)="NumberKey($event )" aria-label="Text input with checkbox" placeholder="Crédito" [(ngModel)]="sale.paymentMethod.credito" [disabled]="!ckbCredito" name="credito">

          <div class="input-group-prepend">
            <div class="input-group-text">
              <label><input type="checkbox" [(ngModel)]="ckbDebito"></label>
            </div>
          </div>
          <input type="text" class="form-control" (keypress)="NumberKey($event )" aria-label="Text input with checkbox" placeholder="Débito" [(ngModel)]="sale.paymentMethod.debito" [disabled]="!ckbDebito" name="debito">
        </div>

        <div class="input-group mb-3">
          <div class="input-group-prepend">
            <div class="input-group-text">
              <label><input type="checkbox" [(ngModel)]="ckbPix"></label>
            </div>
          </div>
          <input type="text" class="form-control" (keypress)="NumberKey($event )" aria-label="Text input with checkbox" placeholder="PIX" [(ngModel)]="sale.paymentMethod.pix" [disabled]="!ckbPix" name="pix">

          <div class="input-group-prepend">
            <div class="input-group-text">
              <label><input type="checkbox" [(ngModel)]="ckbDinheiro"></label>
            </div>
          </div>
          <input type="text" class="form-control" (keypress)="NumberKey($event )" aria-label="Text input with checkbox" placeholder="Dinheiro" [(ngModel)]="sale.paymentMethod.dinheiro" [disabled]="!ckbDinheiro" name="dinheiro">
        </div>
        
      </div>

      
      <div class="input-group mb-3">
        <div class="input-group-prepend">
          <div class="input-group-text">
            <label><input type="checkbox" [(ngModel)]="ckbEndereco"></label>
          </div>
        </div>
        <input type="text" class="form-control" aria-label="Text input with checkbox" placeholder="Endereço" [(ngModel)]="sale.address" [disabled]="!ckbEndereco">
        <div class="input-group-prepend">
          <input type="time" class="form-control"><!-- TROAR POR UM INPUT COM MASK -->
        </div>
      </div>
    </div>

    <div buttons>
      <button type="button" class="btn btn-success m-2" data-bs-dismiss="modal" (click)="finishSale()">Finalizar</button>
      <button type="button" class="btn btn-danger m-2" data-bs-dismiss="modal" (click)="cancelSale()">Cancelar</button>
    </div>
  </app-modal>

  <app-modal idModel="updateProduct" title="Editar produto: {{product.name}}">
    <div inputs>
      <div class="input-group mb-3">
        <span class="input-group-text" id="inputGroup-sizing-default">Nome do Produto</span>
        <input type="text" class="form-control" aria-label="Sizing example input" aria-describedby="inputGroup-sizing-default" [(ngModel)]="product.name" name="name" disabled>
      </div>
      <div class="input-group mb-3">
        <span class="input-group-text">0.00</span>
        <input type="text" (keypress)="NumberKey($event)" class="form-control" aria-label="Dollar amount (with dot and two decimal places)"  [(ngModel)]="product.quantity" name="price" required>
      </div>
    </div>
    <div buttons>
      <button type="button" class="btn btn-secondary m-2" data-bs-dismiss="modal" (click)="closeModal()">Fechar</button>
      <button type="button" class="btn btn-success m-2" (click)="updateProduct(product)" data-bs-dismiss="modal">Salvar</button>
      <button type="button" class="btn btn-danger m-2" data-bs-dismiss="modal" (click)="deleteProduct(product)">Excluir</button>
    </div>
  </app-modal>
